<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+JP:wght@900&family=M+PLUS+Rounded+1c:wght@400;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 14px; padding: 24px;
      font-family: "M PLUS Rounded 1c", system-ui, sans-serif; color: #11304a;
      background: radial-gradient(60% 50% at 30% 20%, #e3ffe9, transparent), radial-gradient(60% 50% at 80% 80%, #cfeeff, transparent), #f1fbff;
    }
    .kanji { font-family: "Noto Sans JP", sans-serif; font-size: clamp(80px, 18vw, 160px); color: #1d8cff; line-height: 1; text-shadow: 6px 6px 0 #23c483; }
    h1 { font-family: "Bangers", sans-serif; font-size: clamp(40px, 8vw, 72px); letter-spacing: 3px; }
    p { color: #4d6d87; max-width: 420px; margin: 0 auto; }
    a { display: inline-block; margin-top: 10px; padding: 12px 24px; border-radius: 12px; background: #1d8cff; color: #fff; font-weight: 800; text-decoration: none; }
    a:hover { background: #23c483; }
  </style>
</head>
<body>
  <div class="kanji">迷子</div>
  <h1>404 — Lost in another world</h1>
  <p>This page took a wrong turn and got isekai'd. Let's head back to the main story.</p>
  <p><a href="/">← Return to the portfolio</a></p>
</body>
</html>
